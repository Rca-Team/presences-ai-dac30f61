version: "3.9"
services:
  bridge:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    env_file: .env
    command: bash -c "apt-get update && apt-get install -y --no-install-recommends libgl1 libglib2.0-0 && pip install --no-cache-dir -r requirements.txt && python bridge.py"
    restart: unless-stopped
