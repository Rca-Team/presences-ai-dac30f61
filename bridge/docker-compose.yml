version: "3.9"
services:
  bridge:
    image: nvidia/cuda:12.1.1-cudnn8-runtime-ubuntu22.04
    working_dir: /app
    volumes:
      - .:/app
    env_file: .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: bash -c "apt-get update && apt-get install -y --no-install-recommends python3 python3-pip libgl1 libglib2.0-0 && pip3 install --no-cache-dir -r requirements.txt && python3 bridge.py"
    restart: unless-stopped
